<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiMo Chat - 智能对话助手</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #667eea;
            --primary-dark: #5a6fd6;
            --accent: #ff6900;
            --accent-light: #ff9500;
            --bg: #f5f7fb;
            --surface: #ffffff;
            --text: #1a1a2e;
            --text-secondary: #6b7280;
            --border: #e5e7eb;
            --user-bg: #667eea;
            --assistant-bg: #f0f0f0;
            --error-bg: #fef2f2;
            --error-text: #dc2626;
            --success-bg: #f0fdf4;
            --success-text: #16a34a;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }
        /* 侧边栏 */
        .sidebar {
            width: 280px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s;
        }
        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-header h2 {
            font-size: 16px;
            color: var(--text);
            margin-bottom: 12px;
        }
        .new-chat-btn {
            width: 100%;
            padding: 10px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .new-chat-btn:hover { background: var(--primary-dark); }
        .conversation-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .conversation-item {
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 4px;
            transition: background 0.2s;
            position: relative;
        }
        .conversation-item:hover { background: var(--bg); }
        .conversation-item.active { background: var(--bg); }
        .conversation-item .title {
            font-size: 14px;
            color: var(--text);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .conversation-item .preview {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .conversation-item .delete-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
            font-size: 16px;
        }
        .conversation-item:hover .delete-btn { opacity: 1; }
        /* 主区域 */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .menu-btn {
            display: none;
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
        }
        .header .badge {
            background: var(--bg);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .settings-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .settings-btn:hover { background: var(--bg); }
        /* 聊天区域 */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .welcome-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            color: var(--text-secondary);
        }
        .welcome-screen .logo { font-size: 64px; }
        .welcome-screen h2 { font-size: 24px; color: var(--text); }
        .welcome-screen p { font-size: 14px; max-width: 400px; text-align: center; line-height: 1.6; }
        .quick-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 12px;
        }
        .quick-action {
            padding: 10px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .quick-action:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 14px;
            white-space: pre-wrap;
            word-break: break-word;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user {
            align-self: flex-end;
            background: var(--user-bg);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.assistant {
            align-self: flex-start;
            background: var(--assistant-bg);
            color: var(--text);
            border-bottom-left-radius: 4px;
        }
        .message.error {
            align-self: center;
            background: var(--error-bg);
            color: var(--error-text);
            font-size: 13px;
        }
        .message-meta {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 6px;
        }
        .message.user .message-meta { color: rgba(255,255,255,0.7); }
        /* 输入区域 */
        .input-area {
            padding: 16px 20px;
            background: var(--surface);
            border-top: 1px solid var(--border);
        }
        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            max-width: 900px;
            margin: 0 auto;
        }
        .input-wrapper textarea {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            resize: none;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            max-height: 200px;
            min-height: 44px;
        }
        .input-wrapper textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        .send-btn {
            padding: 12px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .send-btn:hover { background: var(--primary-dark); }
        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .input-hint {
            font-size: 11px;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 8px;
        }
        /* 打字指示器 */
        .typing-indicator {
            display: none;
            align-self: flex-start;
            padding: 12px 16px;
            background: var(--assistant-bg);
            border-radius: 12px;
            border-bottom-left-radius: 4px;
        }
        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        /* 设置面板 */
        .settings-panel {
            display: none;
            position: fixed;
            top: 0;
            right: 0;
            width: 360px;
            height: 100vh;
            background: var(--surface);
            box-shadow: -4px 0 20px rgba(0,0,0,0.1);
            z-index: 100;
            flex-direction: column;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
        .settings-panel.open { display: flex; }
        .settings-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .settings-header h3 { font-size: 16px; }
        .close-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
        }
        .settings-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .setting-group {
            margin-bottom: 20px;
        }
        .setting-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
        }
        .setting-group input, .setting-group select, .setting-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        .setting-group input:focus, .setting-group select:focus, .setting-group textarea:focus {
            border-color: var(--primary);
        }
        .setting-group .hint {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 6px;
        }
        /* 统计信息 */
        .stats-bar {
            display: flex;
            gap: 16px;
            padding: 8px 20px;
            background: var(--bg);
            font-size: 11px;
            color: var(--text-secondary);
            justify-content: center;
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        /* 响应式 */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                height: 100vh;
                z-index: 50;
                transform: translateX(-100%);
            }
            .sidebar.open { transform: translateX(0); }
            .menu-btn { display: block; }
            .message { max-width: 90%; }
            .settings-panel { width: 100%; }
        }
    </style>
</head>
<body>
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>对话列表</h2>
            <button class="new-chat-btn" onclick="newChat()">
                <span>+</span> 新建对话
            </button>
        </div>
        <div class="conversation-list" id="conversationList"></div>
    </aside>

    <!-- 主区域 -->
    <main class="main">
        <header class="header">
            <div class="header-left">
                <button class="menu-btn" onclick="toggleSidebar()">☰</button>
                <h1>MiMo Chat</h1>
                <span class="badge" id="model-badge">MiMo</span>
            </div>
            <div class="header-right">
                <button class="settings-btn" onclick="toggleSettings()">⚙️</button>
            </div>
        </header>

        <div class="chat-area" id="chatArea">
            <div class="welcome-screen" id="welcomeScreen">
                <div class="logo">💬</div>
                <h2>MiMo Chat</h2>
                <p>基于大语言模型的智能对话助手，支持推理、数学和代码任务</p>
                <div class="quick-actions">
                    <div class="quick-action" onclick="quickAsk('帮我写一个Python快速排序算法')">💻 代码生成</div>
                    <div class="quick-action" onclick="quickAsk('解释一下什么是递归')">📚 概念解释</div>
                    <div class="quick-action" onclick="quickAsk('计算 123 * 456 + 789')">🔢 数学计算</div>
                    <div class="quick-action" onclick="quickAsk('用中文写一首关于春天的诗')">✍️ 创意写作</div>
                </div>
            </div>
        </div>

        <div class="stats-bar" id="statsBar" style="display:none">
            <div class="stat-item">Token: <span id="totalTokens">0</span></div>
            <div class="stat-item">速度: <span id="tokensPerSec">0</span> tok/s</div>
            <div class="stat-item">耗时: <span id="elapsedTime">0</span>s</div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="userInput" rows="1" placeholder="输入你的问题..." onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
            </div>
            <div class="input-hint">Enter 发送，Shift+Enter 换行</div>
        </div>
    </main>

    <!-- 设置面板 -->
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-header">
            <h3>设置</h3>
            <button class="close-btn" onclick="toggleSettings()">✕</button>
        </div>
        <div class="settings-body">
            <div class="setting-group">
                <label>模型</label>
                <select id="modelSelect">
                    <option value="MiMo-7B-RL">MiMo-7B-RL</option>
                </select>
                <div class="hint">选择要使用的模型</div>
            </div>
            <div class="setting-group">
                <label>温度 (Temperature)</label>
                <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7" oninput="updateTempLabel(this.value)">
                <span id="tempLabel">0.7</span>
                <div class="hint">值越高回答越随机，值越低越确定</div>
            </div>
            <div class="setting-group">
                <label>最大Token数</label>
                <input type="number" id="maxTokens" value="2048" min="100" max="8192">
                <div class="hint">单次回复的最大长度</div>
            </div>
            <div class="setting-group">
                <label>系统提示词</label>
                <textarea id="systemPrompt" rows="4">你是一个智能AI助手，擅长推理、数学和代码任务。请用中文回答用户的问题。回答要简洁明了，逻辑清晰。</textarea>
                <div class="hint">设定AI的角色和行为</div>
            </div>
        </div>
    </div>

    <script>
        let conversations = {};
        let currentConversationId = null;
        let isProcessing = false;

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadConversations();
            const textarea = document.getElementById('userInput');
            textarea.addEventListener('input', () => autoResize(textarea));
        });

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 200) + 'px';
        }

        function handleKeyDown(e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function toggleSettings() {
            document.getElementById('settingsPanel').classList.toggle('open');
        }

        function updateTempLabel(val) {
            document.getElementById('tempLabel').textContent = val;
        }

        function newChat() {
            currentConversationId = null;
            document.getElementById('chatArea').innerHTML = '';
            document.getElementById('welcomeScreen').style.display = 'flex';
            document.getElementById('statsBar').style.display = 'none';
            document.getElementById('chatArea').appendChild(document.getElementById('welcomeScreen'));
            loadConversations();
        }

        function quickAsk(text) {
            document.getElementById('userInput').value = text;
            sendMessage();
        }

        async function loadConversations() {
            try {
                const res = await fetch('/api/conversations');
                const data = await res.json();
                conversations = {};
                const list = document.getElementById('conversationList');
                list.innerHTML = '';
                data.conversations.forEach(conv => {
                    conversations[conv.id] = conv;
                    const item = document.createElement('div');
                    item.className = `conversation-item ${conv.id === currentConversationId ? 'active' : ''}`;
                    item.innerHTML = `
                        <div class="title">${escapeHtml(conv.title)}</div>
                        <div class="preview">${conv.message_count} 条消息</div>
                        <button class="delete-btn" onclick="event.stopPropagation(); deleteConversation('${conv.id}')">✕</button>
                    `;
                    item.onclick = () => loadConversation(conv.id);
                    list.appendChild(item);
                });
            } catch (e) {
                console.error('加载对话列表失败:', e);
            }
        }

        async function loadConversation(convId) {
            try {
                const res = await fetch(`/api/conversations/${convId}`);
                const data = await res.json();
                currentConversationId = convId;
                const chatArea = document.getElementById('chatArea');
                chatArea.innerHTML = '';
                document.getElementById('welcomeScreen').style.display = 'none';
                data.messages.forEach(msg => {
                    addMessage(msg.content, msg.role);
                });
                loadConversations();
            } catch (e) {
                console.error('加载对话失败:', e);
            }
        }

        async function deleteConversation(convId) {
            try {
                await fetch(`/api/conversations/${convId}`, { method: 'DELETE' });
                if (currentConversationId === convId) {
                    newChat();
                }
                loadConversations();
            } catch (e) {
                console.error('删除对话失败:', e);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function addMessage(content, role, meta = null) {
            const chatArea = document.getElementById('chatArea');
            const welcomeScreen = document.getElementById('welcomeScreen');
            if (welcomeScreen) welcomeScreen.style.display = 'none';

            const div = document.createElement('div');
            div.className = `message ${role}`;
            let html = escapeHtml(content);
            if (meta) {
                html += `<div class="message-meta">${meta}</div>`;
            }
            div.innerHTML = html;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
            return div;
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message || isProcessing) return;

            isProcessing = true;
            document.getElementById('sendBtn').disabled = true;
            input.value = '';
            input.style.height = 'auto';

            addMessage(message, 'user');

            const typing = document.createElement('div');
            typing.className = 'typing-indicator';
            typing.innerHTML = '<span></span><span></span><span></span>';
            typing.style.display = 'flex';
            document.getElementById('chatArea').appendChild(typing);
            document.getElementById('statsBar').style.display = 'flex';

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message,
                        conversation_id: currentConversationId
                    })
                });

                const data = await res.json();
                typing.remove();

                if (data.error) {
                    addMessage('错误: ' + data.error, 'error');
                } else {
                    const meta = `${data.usage.total_tokens} tokens · ${data.performance.elapsed_seconds}s · ${data.performance.tokens_per_second} tok/s`;
                    addMessage(data.response, 'assistant', meta);
                    currentConversationId = data.conversation_id;
                    document.getElementById('totalTokens').textContent = data.usage.total_tokens;
                    document.getElementById('tokensPerSec').textContent = data.performance.tokens_per_second;
                    document.getElementById('elapsedTime').textContent = data.performance.elapsed_seconds;
                    if (data.model) {
                        document.getElementById('model-badge').textContent = data.model;
                    }
                    loadConversations();
                }
            } catch (err) {
                typing.remove();
                addMessage('请求失败: ' + err.message, 'error');
            }

            isProcessing = false;
            document.getElementById('sendBtn').disabled = false;
            input.focus();
        }
    </script>
</body>
</html>
